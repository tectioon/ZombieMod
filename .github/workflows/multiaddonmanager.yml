name: MultiAddonManager (patched v1.5.4)

# MultiAddonManager v1.5.4 rebuilt with the CNetworkGameServer offsets from upstream PR #76. The
# 2026-09-23 CS2 update moved the client list 584 -> 616 and the addons string 344 -> 376, the same
# +32 shift as our own CNetworkGameServer_ClientList gamedata (73 -> 77). With the stale offsets MAM
# reads garbage as the client list when it kicks a client that timed out downloading addons
# (Hook_GameFrame), and the whole server segfaults (2026-09-27). v1.6.1 has the fix but needs a
# KHook Metamod, which this server can't run yet (see CLAUDE.md), so v1.5.4 is built here against the
# same pre-KHook Metamod and SDK pin as CS2Fixes.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/multiaddonmanager.yml'

jobs:
  build:
    name: SteamRT3 Build
    runs-on: ubuntu-latest
    container: ghcr.io/source2ze/build-containers:steamrt3
    steps:
      - name: Checkout MultiAddonManager v1.5.4
        uses: actions/checkout@v7
        with:
          repository: Source2ZE/MultiAddonManager
          ref: v1.5.4
          path: MultiAddonManager
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          # Same pin as build.yml: the last commit before Metamod's KHook change
          ref: 7ec0f16948ab3a0910a98b4ac10e1c0e360d5339
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout HL2SDK
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          # Same commit as this repo's sdk submodule (updated for the 2026-09-22/23 CS2 updates)
          ref: 625bfd4e39816ad0e1eae3b3144a3b5425c5c7a0
          path: hl2sdk-cs2

      - name: Apply the 2026-09-23 offsets
        working-directory: MultiAddonManager
        shell: bash
        run: |
          sed -i 's/g_iServerAddonsOffset = 344;/g_iServerAddonsOffset = 376;/; s/g_iClientListOffset = 584;/g_iClientListOffset = 616;/' src/multiaddonmanager.cpp
          grep -n "g_iServerAddonsOffset = 376;" src/multiaddonmanager.cpp
          grep -n "g_iClientListOffset = 616;" src/multiaddonmanager.cpp

      - name: Build
        working-directory: MultiAddonManager
        shell: bash
        run: |
          mkdir build && cd build
          python ../configure.py --enable-optimize --sdks cs2
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MultiAddonManager-SteamRT3
          path: MultiAddonManager/build/package
